name: Deploy update-2.zip

on:
  push:
    paths:
      - ".github/workflows/deploy-update.yml"

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uitpakken, opruimen, committen
        run: |
          unzip -q -o update-2.zip -d .
          rm -f update-2.zip .github/workflows/deploy-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Badge-sectie in app-weergave, 'Waarom is dit gratis' verwijderd" || echo "Niets te committen"
          git push
      - name: GitHub Pages build starten
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
