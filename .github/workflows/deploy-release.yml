name: Deploy vanuit release v1.0-bron

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/deploy-release.yml"

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip ophalen en uitpakken over de repo-root
        run: |
          curl -sSL -o /tmp/site.zip "https://github.com/${{ github.repository }}/releases/download/v1.0-bron/dierenkliniek-nl-alles.zip"
          unzip -q -o /tmp/site.zip -d .
          rm -f scraper_emails.py businessplan-dierenkliniek.docx businessplan-dierenkliniek.pdf dierenklinieken-nederland.xlsx mailing-dierenklinieken.md wervingsmail-template.md zi0TrEy6 ziiR4gLQ
          echo "dierenkliniek.nl" > CNAME
          find . -type f -not -path './.git/*' | wc -l

      - name: Committen en pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete deployment: alles bijgewerkt" || echo "Niets te committen"
          git push

      - name: GitHub Pages build starten
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
